name: Build component-isolation diagnostics

on:
  push:
    branches: [diagnostics/antivirus-isolation]
    paths:
      - Diagnostics/**
      - .github/workflows/diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    name: Build and verify five diagnostic controls
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out diagnostic source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile and verify on Windows
        shell: pwsh
        run: ./Diagnostics/Build-WindowsDiagnostics.ps1
      - name: Retain diagnostic EXEs and Greek guide
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: budgetdesk-component-diagnostics
          path: diagnostic-dist/*
          if-no-files-found: error
          retention-days: 30
